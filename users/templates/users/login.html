{% extends "blog/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="content-section" style="margin-left: 50%; margin-top: 50px; border-color: black;">
        <form method="POST">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4 " style="text-align: center; ">Login</legend>
                {{form|crispy}}
            </fieldset>
            <div class="form-group">
                <button class="btn btn-outline-info " type="submit" style="color: black; margin-left: 40%; border-color: black;" >Login</button>
            </div>
        </form>
        <div class="border-top pt-3">
            <small class="text-muted" >
                Dont't have an account? <a class="ml-3" style="color: black " href="{% url 'register' %}" > Sign Up</a>
            </small>
        </div>
    </div>
{% endblock content %}
